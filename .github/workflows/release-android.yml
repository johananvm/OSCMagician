name: Android build

on:
  push:
    branches:
      - "**"
    tags:
      - "**"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.9"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || \
             [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || \
             [ -z "$ANDROID_KEY_ALIAS" ] || \
             [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Configure all four Android signing secrets before building the APK and app bundle."
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          {
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=../upload-keystore.jks\n'
          } > android/key.properties

      - name: Build release APK and app bundle
        run: |
          build_args=(--build-number="$GITHUB_RUN_NUMBER")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            build_args+=(--build-name="${GITHUB_REF_NAME#v}")
          fi
          flutter build apk --release "${build_args[@]}"
          flutter build appbundle --release "${build_args[@]}"

      - name: Name release files
        id: packages
        run: |
          version="$(awk -F= '$1 == "flutter.versionName" { print substr($0, index($0, "=") + 1) }' android/local.properties)"
          if [[ ! "$version" =~ ^[a-zA-Z0-9][a-zA-Z0-9.+_-]*$ ]]; then
            echo "::error::Invalid or missing Android version name in android/local.properties."
            exit 1
          fi
          apk_path="build/app/outputs/flutter-apk/OSCMagician${version}.apk"
          bundle_path="build/app/outputs/bundle/release/OSCMagician${version}.aab"
          cp build/app/outputs/flutter-apk/app-release.apk "$apk_path"
          cp build/app/outputs/bundle/release/app-release.aab "$bundle_path"
          echo "apk_path=$apk_path" >> "$GITHUB_OUTPUT"
          echo "bundle_path=$bundle_path" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: osc-magician-apk
          path: ${{ steps.packages.outputs.apk_path }}
          if-no-files-found: error

      - name: Upload app bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: osc-magician-appbundle
          path: ${{ steps.packages.outputs.bundle_path }}
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: OSC Magician ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          overwrite_files: true
          files: |
            ${{ steps.packages.outputs.apk_path }}
            ${{ steps.packages.outputs.bundle_path }}
